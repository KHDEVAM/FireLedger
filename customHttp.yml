# Amplify Hosting custom headers: caching + security.
customHeaders:
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Permissions-Policy
        value: geolocation=(), camera=(), microphone=()
      # basemap (OpenFreeMap), NASA GIBS imagery, Overpass and Nominatim are the only external hosts
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tiles.openfreemap.org https://gibs.earthdata.nasa.gov; font-src 'self' data:; worker-src 'self' blob:; child-src blob:; connect-src 'self' https://tiles.openfreemap.org https://gibs.earthdata.nasa.gov https://overpass-api.de https://overpass.private.coffee https://overpass.kumi.systems https://nominatim.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
  - pattern: '/assets/*'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '/data/*'
    headers:
      - key: Cache-Control
        value: public, max-age=3600
  - pattern: '/brand/*'
    headers:
      - key: Cache-Control
        value: public, max-age=604800
